<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b6b62" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Financeiro" />
    <link rel="icon" href="/icone.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icone-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Gestão financeira pessoal" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Financeiro</title>
    <script>
      // Aplica o tema escolhido antes de desenhar, para não piscar ao abrir.
      try {
        var t = localStorage.getItem("tf-tema");
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
          document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "dark" ? "#151d20" : "#0b6b62");
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <style>
      .pre{min-height:100dvh;display:grid;place-content:center;justify-items:center;gap:14px;font-family:"Sora",ui-sans-serif,system-ui,sans-serif;color:#0f1a1c;background:#f3f5f4;text-align:center;padding:16px}
      .pre b{font-size:18px;font-weight:600}
      .pre-marca{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(140deg,#0e8a7e,#0b6b62)}
      .pre-barra{width:180px;height:5px;border-radius:999px;background:#e3e8e7;overflow:hidden}
      .pre-barra i{display:block;width:40%;height:100%;border-radius:inherit;background:#0b6b62;animation:pre 1.2s ease-in-out infinite}
      @keyframes pre{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
      @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pre{color:#e9eff0;background:#0b1113}:root:not([data-theme="light"]) .pre-barra{background:#223035}}
      :root[data-theme="dark"] .pre{color:#e9eff0;background:#0b1113}
      :root[data-theme="dark"] .pre-barra{background:#223035}
      @media (prefers-reduced-motion:reduce){.pre-barra i{animation:none;width:100%}}
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Aparece na hora, antes do JavaScript; o app troca pela tela dele ao carregar. -->
      <div class="pre">
        <span class="pre-marca"><svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true"><path d="M16 44V30M28 44V22M40 44V34M52 44V16" stroke="#fff" stroke-width="7" stroke-linecap="round" /></svg></span>
        <b>Estamos carregando seus dados</b>
        <span class="pre-barra"><i></i></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
