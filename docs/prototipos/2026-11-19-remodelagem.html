<title>Financeiro remodelado</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: barra de controle do protótipo, depois o "aparelho" (PC ou celular) e ao lado as notas do que mudou.
   Cores e fontes seguem o Financeiro atual (verde-petróleo, Sora + IBM Plex). */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#eef3f2; --line:#e3e8e7;
  --ink:#0f1a1c; --ink-2:#47565b; --ink-3:#77868b;
  --accent:#0b6b62; --accent-2:#0e8a7e; --accent-soft:#dcefec; --on-accent:#ffffff;
  --good:#1d7a3a; --good-soft:#e2f2e6; --warn:#a86400; --warn-soft:#fbefdc; --bad:#b3261e; --bad-soft:#fbe4e2;
  --stage:#e6ebea;
  --g1:#2f7f86; --g2:#c0763a; --g3:#5a6fb0; --g4:#b5506f; --g5:#7b62b3; --g6:#3f8f5a; --g7:#a3843a; --g8:#7d6f68; --g9:#8a979b;
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px; --r-sm:10px;
  --sombra:0 1px 2px rgba(15,26,28,.04),0 4px 16px -6px rgba(15,26,28,.08);
  --sombra-alta:0 2px 4px rgba(15,26,28,.06),0 24px 48px -16px rgba(15,26,28,.22);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1113; --surface:#121a1d; --surface-2:#182326; --line:#223035;
  --ink:#e9eff0; --ink-2:#a9b7bc; --ink-3:#7f8f95;
  --accent:#4fbfb2; --accent-2:#6fd3c6; --accent-soft:#16312e; --on-accent:#062320;
  --good:#5cc27a; --good-soft:#15291c; --warn:#e2a23b; --warn-soft:#2e2412; --bad:#f07068; --bad-soft:#341a19;
  --stage:#070b0c;
  --g1:#5fb3b9; --g2:#e09a5f; --g3:#8b9de0; --g4:#e07f9c; --g5:#a891df; --g6:#6cc28a; --g7:#d2b162; --g8:#ab9c94; --g9:#8a979b;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 6px 20px -8px rgba(0,0,0,.5);
  --sombra-alta:0 2px 6px rgba(0,0,0,.35),0 24px 48px -16px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1113; --surface:#121a1d; --surface-2:#182326; --line:#223035;
  --ink:#e9eff0; --ink-2:#a9b7bc; --ink-3:#7f8f95;
  --accent:#4fbfb2; --accent-2:#6fd3c6; --accent-soft:#16312e; --on-accent:#062320;
  --good:#5cc27a; --good-soft:#15291c; --warn:#e2a23b; --warn-soft:#2e2412; --bad:#f07068; --bad-soft:#341a19;
  --stage:#070b0c;
  --g1:#5fb3b9; --g2:#e09a5f; --g3:#8b9de0; --g4:#e07f9c; --g5:#a891df; --g6:#6cc28a; --g7:#d2b162; --g8:#ab9c94; --g9:#8a979b;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 6px 20px -8px rgba(0,0,0,.5);
  --sombra-alta:0 2px 6px rgba(0,0,0,.35),0 24px 48px -16px rgba(0,0,0,.7);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--stage);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- barra do protótipo ---------- */
.proto-bar{max-width:1500px;margin:0 auto 16px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.proto-bar h1{font-size:19px;font-weight:600;letter-spacing:-.01em}
.proto-bar p{margin:2px 0 0;color:var(--ink-3);font-size:13px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

.stage{max-width:1500px;margin:0 auto;display:grid;gap:20px;grid-template-columns:minmax(0,1fr) 300px;align-items:start}
.stage.cel{grid-template-columns:minmax(0,1fr) 340px}
@media (max-width:1100px){.stage,.stage.cel{grid-template-columns:minmax(0,1fr)}}
.device-wrap{display:flex;justify-content:center;min-width:0}

/* ---------- aparelho ---------- */
.frame{container:app/inline-size;position:relative;width:100%;height:780px;background:var(--bg);border-radius:18px;overflow:hidden;
  box-shadow:var(--sombra-alta);border:1px solid var(--line)}
.stage.cel .frame{width:390px;max-width:100%;height:812px;border-radius:44px;border:10px solid #10181a}
@media (max-width:520px){.frame,.stage.cel .frame{height:calc(100vh - 140px);min-height:560px;border-radius:18px;border-width:1px}}

.shell{display:grid;grid-template-columns:1fr;grid-template-rows:1fr auto;height:100%}
.side{display:none}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
.main{overflow-y:auto;min-width:0;flex:1;padding:16px 16px 24px}
.appbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.appbar .grow{flex:1}
.appbar .icon-btn{width:34px;height:34px}
.appbar .upd{font-size:12px;color:var(--ink-3);display:none;white-space:nowrap}
.pchip{border:1px dashed var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pchip .tx{display:none}
.pchip.ok{border-style:solid;border-color:transparent;background:var(--good-soft);color:var(--good)}
.spin svg{animation:gira 1s linear infinite}@keyframes gira{to{transform:rotate(360deg)}}
.bottom .plus{align-self:center;justify-self:center;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-top:-22px;box-shadow:var(--sombra-alta);border:4px solid var(--bg);padding:0}
.bottom .plus svg{width:24px;height:24px;stroke-width:2.4}
.lancar{background:var(--accent)!important;color:var(--on-accent)!important;font-weight:600;justify-content:center;margin:0 0 12px}
.rec-btn{margin-left:auto;border:0;background:none;color:var(--ink-3);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;padding:0}
.rec-btn:hover{background:var(--surface-2)}
.rec-btn svg{width:18px;height:18px}
.acao-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.acao-list .opt{align-items:center}
.contas{display:flex;gap:6px;flex-wrap:wrap}
.bottom{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 4px 10px}
.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11px;color:var(--ink-3);border-radius:10px}
.bottom button svg{width:22px;height:22px}
.bottom button[aria-current="page"]{color:var(--accent);font-weight:600}
.bottom button[aria-current="page"] svg{stroke-width:2.2}
.stage.cel .bottom{padding-bottom:18px}

@container app (min-width:760px){
  .shell{grid-template-columns:232px 1fr;grid-template-rows:1fr}
  .bottom{display:none}
  .side{display:flex;flex-direction:column;gap:2px;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;overflow-y:auto}
  .main{padding:24px 28px 32px}
  .appbar{padding:12px 28px}
  .appbar .upd{display:inline}
  .pchip .tx{display:inline}
  .shell.rec{grid-template-columns:72px 1fr}
  .shell.rec .side{padding:18px 10px;align-items:stretch}
  .shell.rec .side span,.shell.rec .side .grp,.shell.rec .brand b,.shell.rec .brand i{display:none}
  .shell.rec .side .grp+*{margin-top:14px}
  .shell.rec .side button{justify-content:center;position:relative}
  .shell.rec .side .badge{position:absolute;top:2px;right:2px;padding:0 5px;font-size:10px}
  .shell.rec .rec-btn{margin:0 auto}
  .shell.rec .brand{padding:2px 0 14px}
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px;font-family:var(--f-display);font-weight:600;font-size:15px}
.brand i{width:28px;height:28px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent);font-style:normal;font-size:14px}
.side .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:16px 10px 6px;font-weight:600}
.side button{border:0;background:none;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-size:14px;color:var(--ink-2);text-align:left}
.side button svg{width:18px;height:18px;flex:none}
.side button:hover{background:var(--surface-2)}
.side button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .badge{margin-left:auto}
.side .spacer{flex:1}

svg.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- conteúdo ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.top h2{font-size:22px;font-weight:600;letter-spacing:-.01em}
.top .sub{color:var(--ink-3);font-size:13px;margin-top:2px}
.mes{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.mes button{border:0;background:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.mes span{font-size:13.5px;font-weight:500;padding:0 6px}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn svg{width:18px;height:18px}
.row{display:flex;align-items:center;gap:8px}

.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@container app (min-width:760px){
  .grid.g2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
  .grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sombra);min-width:0}
.card h3{font-size:15px;font-weight:600;margin-bottom:2px}
.card .desc{color:var(--ink-3);font-size:13px;margin:0 0 12px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.link{border:0;background:none;color:var(--accent);font-size:13px;font-weight:600;padding:0;white-space:nowrap}

.hero{background:var(--accent);color:var(--on-accent);border:0}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-family:var(--f-display);font-size:34px;font-weight:600;letter-spacing:-.02em;margin:2px 0 14px}
.hero .split{display:flex;gap:20px;flex-wrap:wrap;font-size:13px}
.hero .split b{display:block;font-family:var(--f-display);font-size:17px;font-weight:600}
.hero .barra{height:8px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;margin:14px 0 6px}
.hero .barra i{display:block;height:100%;background:currentColor;opacity:.9;border-radius:99px}
.hero .nota{font-size:12.5px;opacity:.85}

.pend{display:flex;gap:12px;align-items:center;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:var(--r);padding:14px 16px}
.pend .dot{width:36px;height:36px;border-radius:50%;background:var(--warn);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);flex:none}
.pend p{margin:0;font-size:13.5px;color:var(--ink-2)}
.pend b{color:var(--ink)}
.pend .btn{margin-left:auto}
.btn{border:0;background:var(--accent);color:var(--on-accent);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn.ghost{background:var(--surface-2);color:var(--ink)}

.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;border:0;background:none;padding:0;text-align:left;width:100%}
.bar-row .nm{display:flex;align-items:center;gap:8px;font-size:13.5px;min-width:0}
.bar-row .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .vl{font-size:13.5px;font-weight:500}
.bar-row .tr{grid-column:1/-1;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar-row .tr i{display:block;height:100%;border-radius:99px}
.sw{width:10px;height:10px;border-radius:3px;flex:none}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t small{color:var(--ink-3);font-size:12.5px}
.li .v{font-weight:500;font-size:14px;text-align:right;white-space:nowrap}
.pos{color:var(--good)}
.neg{color:var(--ink)}

.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 10px 3px 8px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;max-width:100%}
button.pill:hover{border-color:var(--accent)}
.pill.falta{background:var(--warn-soft);border:1px dashed var(--warn);color:var(--warn);font-weight:600}
.pill.neutro{background:transparent;border-style:dashed;color:var(--ink-3)}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-good{background:var(--good-soft);color:var(--good)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-acc{background:var(--accent-soft);color:var(--accent)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;font-size:13.5px;color:var(--ink-2);font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.tabs .cnt{font-size:11.5px;margin-left:4px;opacity:.75}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.chip-sum{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;text-align:left}
.chip-sum small{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12px}
.chip-sum b{font-family:var(--f-display);font-weight:600;font-size:15px}
.chip-sum[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}

.day{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:14px 2px 2px}
.mov{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:8px}
.mov .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mov .t small{color:var(--ink-3);font-size:12.5px}
.mov .v{font-weight:600;text-align:right}
.mov .cat{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
@container app (min-width:760px){
  .mov{grid-template-columns:minmax(0,1fr) 240px 120px}
  .mov .cat{grid-column:auto;grid-row:1;grid-column-start:2}
  .mov .v{grid-column-start:3;grid-row:1}
}
.mov.muted .v{color:var(--ink-3);font-weight:500}

.mov-open{border:0;background:none;padding:0;text-align:left;min-width:0;display:block;width:100%}
.mov-open:hover b{color:var(--accent)}
.busca-row{display:flex;gap:8px;align-items:center}
.busca{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-width:0}
.busca svg{width:18px;height:18px;color:var(--ink-3);flex:none}
.busca input{border:0;background:none;font:inherit;color:var(--ink);padding:9px 0;width:100%;min-width:0;outline:none}
.busca:focus-within{border-color:var(--accent)}
.filtros{margin-top:10px}
.parte{display:flex;gap:6px;align-items:center;margin-top:6px}
.parte input{width:110px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 10px;font:inherit;color:var(--ink)}
.parte select,.field select{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 10px;font:inherit;color:var(--ink)}
.prog{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* dívidas */
.debt-grp{margin-top:18px}
.debt-grp header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 2px 8px}
.debt-grp header h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.debt-grp header span{color:var(--ink-3);font-size:13px}
.debt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;margin-top:8px}
.debt .l1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.debt .l1 b{font-weight:600}
.debt .l1 .v{font-family:var(--f-display);font-weight:600;white-space:nowrap}
.debt .l2{display:flex;justify-content:space-between;gap:10px;color:var(--ink-3);font-size:12.5px;flex-wrap:wrap}
.debt{padding:0;gap:0}
.debt-btn{border:0;background:none;text-align:left;width:100%;padding:14px;display:block;border-radius:12px}
.debt-btn:hover{background:var(--surface-2)}
.debt-det{padding:0 14px 14px;border-top:1px solid var(--line);padding-top:12px}
.mini{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.mini small{display:block;font-size:12px;color:var(--ink-3)}
.mini b{font-family:var(--f-display);font-weight:600;font-size:15px}
.neg-txt{color:var(--bad)}
.ordem{counter-reset:o;display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.ordem li{display:flex;gap:10px;align-items:center;font-size:13.5px}
.ordem li::before{counter-increment:o;content:counter(o);width:22px;height:22px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}

/* análises */
.q{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.ans{font-family:var(--f-display);font-size:18px;font-weight:600;line-height:1.3;margin:6px 0 12px;letter-spacing:-.01em}
.ans em{font-style:normal;color:var(--accent)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font-family:var(--f-body);font-size:11px}
.chart .grid-l{stroke:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* categorias */
.cat-grid{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
@container app (min-width:520px){.cat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cat-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.cat-item .sw{width:12px;height:12px;margin-top:4px}
.cat-item b{font-weight:600;font-size:14px}
.cat-item small{display:block;color:var(--ink-3);font-size:12.5px}

function pillCat(l, cat, valor){
  const c = cat ? catDe(cat, l.tipo) : null;
  const naoConta = cat && (l.tipo==="e" ? !contaGanho(cat) : !contaGasto(cat));
  const vv = valor!=null ? ` ${R0(Math.abs(valor))}` : "";
  if(!c) return `<button class="pill falta" data-cat="${l.id}">${l.tipo==="e"?"De onde veio?":"Escolher categoria"}</button>`;
  if(naoConta) return `<button class="pill neutro" data-cat="${l.id}">${esc(c.n)} · não conta</button>`;
  return `<button class="pill" ${l.partes?`data-det="${l.id}"`:`data-cat="${l.id}"`}>${sw(c.c)}${esc(c.n)}${!l.partes&&l.sub?` · ${esc(l.sub)}`:""}${vv}</button>`;
}
function linhaMov(l){
  const naoConta = l.cat && l.cat!=="dividido" && (l.tipo==="e" ? !contaGanho(l.cat) : !contaGasto(l.cat));
  const pills = l.partes ? l.partes.map(p=>pillCat(l,p.cat,p.v)).join("") : pillCat(l,l.cat);
  const quem = l.tipo==="e" && l.quem && l.cat && contaGanho(l.cat) ? `<span style="font-size:12.5px;color:var(--ink-3)">de ${esc(l.quem)}</span>` : "";

  return `<div class="mov ${naoConta?"muted":""}"><button class="t mov-open" data-det="${l.id}" title="Abrir detalhes"><b>${esc(l.nome)}</b><small>${l.conta} · ${esc(l.orig)}</small></button><div class="cat">${pills}${quem}${link}</div><div class="v ${l.tipo==="e"?"pos":""}">${V(R(l.v,true))}</div></div>`;
}

function simular(extra){
  const d = DIVIDAS.find(x=>x.id==="san"); const P=d.parcela, i=d.juros/100, n=restantes(d), pv=quitarHoje(d);
  if(extra<=0) return null;
  if(extra>=pv) return {quita:true, eco:aPagar(d)-pv, meses:n, sobra:extra-pv};
  const pv2 = pv-extra; const n2 = -Math.log(1-pv2*i/P)/Math.log(1+i);
  return {quita:false, eco:P*n-(extra+P*n2), meses:n-Math.ceil(n2), n2:Math.ceil(n2)};
}
function telaDividas(){

  const hist = d => parcelado(d)

    : (d.hist||[]).map(([dt,v])=>[dt,v,"Pagamento"]).reverse();
  const sim = simular(S.adiantar||0);

        ${parcelado(d)?`<div class="prog" style="margin-top:8px"><i style="width:${d.pago/d.total*100}%"></i></div>`:""}
        <div class="l2" style="margin-top:6px"><span>${parcelado(d)?`${d.pago} de ${d.total} pagas`:"Valor em aberto"}</span><span>${prox(d)}</span></div>
      </button>
      ${aberta?`<div class="debt-det">
        <div class="grid g3" style="gap:8px">
          <div class="mini"><small>Para quitar hoje</small><b>${V(R(quitarHoje(d)))}</b></div>
          <div class="mini"><small>Pagando até o fim</small><b>${V(R(aPagar(d)))}</b></div>
          <div class="mini"><small>Juros que faltam</small><b class="${jf>0?"neg-txt":""}">${d.atraso?"cresce com a multa":V(R(jf))}</b></div>
        </div>

function svgSobra(){
  const ent = HIST.entrou.slice(), sai = HIST.saiu.slice(); const t = totais(); ent[5]=t.entrou; sai[5]=t.saiu;
  const n = S.periodo, ini = 6-n; const sob = ent.map((e,i)=>e-sai[i]).slice(ini); const ms = MESES.slice(ini);
  const W=560,H=200,pl=44,pr=8,pt=12,pb=26; const mx = Math.max(400, ...sob.map(Math.abs));
  const top = Math.ceil(mx/200)*200; const y = v => pt+(H-pt-pb)/2 - v/top*((H-pt-pb)/2);
  const bw = (W-pl-pr)/sob.length;
  let g = "";
  [top,top/2,0,-top/2,-top].forEach(v=>{g+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" ${v===0?'stroke-width="1.4"':'stroke-dasharray="2 4"'}/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v===0?"0":(v>0?"+":"−")+Math.abs(v)}</text>`});
  sob.forEach((v,i)=>{const x=pl+i*bw+bw*0.22, w=bw*0.56, y0=y(0), y1=y(v); g+=`<rect x="${x}" y="${Math.min(y0,y1)}" width="${w}" height="${Math.max(1,Math.abs(y1-y0))}" rx="4" fill="var(${v>=0?"--good":"--bad"})"/><text x="${x+w/2}" y="${H-8}" text-anchor="middle">${ms[i]}${i===sob.length-1?"*":""}</text>`;});
  const pos = sob.filter(v=>v>0).length, med = sob.reduce((a,b)=>a+b,0)/sob.length;
  return {svg:`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Quanto sobrou por mês">${g}</svg>`, pos, med, n:sob.length};
}
function svgCategorias(){

function previsao(){
  const t = totais();
  const parcelas = -L.filter(l=>l.cat==="parcela_divida").reduce((s,l)=>s+l.v,0);
  const fixas = [["Internet","25/11",99.9],["Seguro do carro","28/11",142]];

  const diaADia = variaveis/19*11;
  const fim = t.sobra - parcelas - fixasV - diaADia;
  return {passos:[["Sobrou até hoje",t.sobra],["Parcelas de dívida do mês",-parcelas],["Contas fixas que faltam",-fixasV],["Dia a dia até o fim do mês",-diaADia]], fim, fixas, diaADia};
}
function svgCascata(p){
  const W=560,H=210,pl=8,pr=8,pt=22,pb=34; const passos=[...p.passos,["Fim do mês",p.fim]];
  let acc=0; const barras=passos.map(([n,v],i)=>{ if(i===passos.length-1) return {n,ini:0,fim:v,tot:true}; const ini=acc; acc+=v; return {n,ini,fim:acc}; });
  const mx=Math.max(...barras.map(b=>Math.max(b.ini,b.fim)),0), mn=Math.min(...barras.map(b=>Math.min(b.ini,b.fim)),0);
  const y=v=>pt+(mx-v)/(mx-mn||1)*(H-pt-pb); const bw=(W-pl-pr)/barras.length;
  let g=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke-width="1.4"/>`;
  barras.forEach((b,i)=>{ const x=pl+i*bw+bw*.18, w=bw*.64; const y1=y(Math.max(b.ini,b.fim)), y2=y(Math.min(b.ini,b.fim));
    const cor = b.tot ? (b.fim>=0?"--good":"--bad") : (i===0?"--accent":"--ink-3");

    g+=`<text x="${x+w/2}" y="${y1-6}" text-anchor="middle" style="fill:var(--ink-2);font-weight:600">${(val<0?"−":"")+Math.round(Math.abs(val)).toLocaleString("pt-BR")}</text>`;
    const nome=b.n.split(" "); const l1=nome.slice(0,2).join(" "), l2=nome.slice(2).join(" ");

  });

    <div class="col">${appbar()}<main class="main">${conteudo()}</main></div>
    <nav class="bottom" aria-label="Menu">${NAV_CEL.map(([k,n])=>k==="plus"?`<button class="plus" data-act="acao" aria-label="Lançar">${ic("plus")}</button>`:`<button data-go="${k}" ${ativoCel===k?'aria-current="page"':""}>${ic(k)}<span>${n}</span></button>`).join("")}</nav>
  </div>${sheet}${S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:""}`;
  const m = frame.querySelector(".main"); if(m && S._keep) m.scrollTop = scroll; S._keep=false;
  notesEl.innerHTML = notas();
  stage.classList.toggle("cel", S.ver==="cel");
  document.getElementById("ver-pc").setAttribute("aria-pressed", S.ver==="pc");
  document.getElementById("ver-cel").setAttribute("aria-pressed", S.ver==="cel");
}
function ir(tela){ S.tela = tela; S.sheet=null; S.acao=false; S.novo=null; try{ if(location.hash!=="#"+tela) history.replaceState(null,"","#"+tela);}catch(e){} render(); const m=frame.querySelector(".main"); if(m) m.scrollTop=0; }
let toastT;
function avisar(t){ S.toast=t; clearTimeout(toastT); toastT=setTimeout(()=>{S.toast=null;S._keep=true;render();},2200); }

frame.addEventListener("click", ev=>{
  const b = ev.target.closest("button,[data-fechar]"); if(!b) return;
  if(b.hasAttribute("data-fechar") && ev.target!==b) { if(!ev.target.closest(".sheet")){} else return; }
  if(b.dataset.fechar!==undefined && ev.target===b){ S.det=null; S.rapido=null; S.novoTipo=false; S.criar=null; S.sheet=null; S.acao=false; S.novo=null; S._keep=true; return render(); }
  if(b.dataset.fecharBtn!==undefined){ if(S.novo||S.acao||S.novoTipo||S.det||S.rapido){ S.novo=null; S.acao=false; S.novoTipo=false; S.det=null; S.rapido=null; S._keep=true; return render(); } if(S.criar){ const v=S.criar.voltar; S.criar=null; S._keep=true; if(!v) S.sheet=null; return render(); } S.sheet=null; S._keep=true; return render(); }
  if(b.dataset.go){ if(b.dataset.mov) S.mov=b.dataset.mov; S.filtro=b.dataset.filtro||null; S.soPend=false; return ir(b.dataset.go); }
  if(b.dataset.act==="organizar"){ S.acao=false; if(!pendentes().length) return; S.rapido={fila:pendentes().map(l=>l.id), i:0, feitos:0, pulados:0}; S._keep=true; return render(); }
  if(b.dataset.filtros!==undefined){ S.filtrosAbertos=!S.filtrosAbertos; S._keep=true; return render(); }
  if(b.dataset.fconta){ S.conta = S.conta===b.dataset.fconta?null:b.dataset.fconta; S._keep=true; return render(); }
  if(b.dataset.fvalor!==undefined){ S.valorMin=+b.dataset.fvalor; S._keep=true; return render(); }
  if(b.dataset.det){ const l=L.find(x=>x.id===b.dataset.det); S.det={id:l.id, nome:l.nome, cat:l.cat==="dividido"?null:l.cat, partes:l.partes?l.partes.map(p=>({v:Math.abs(p.v),cat:p.cat})):null, link:l.link||null}; S._keep=true; return render(); }
  if(b.dataset.dividir!==undefined){ lerDet(); const l=L.find(x=>x.id===S.det.id); const t=Math.abs(l.v); const a=Math.round(t*0.8*100)/100; S.det.partes=[{v:a,cat:S.det.cat},{v:Math.round((t-a)*100)/100,cat:null}]; S._keep=true; return render(); }
  if(b.dataset.addParte!==undefined){ lerDet(); S.det.partes.push({v:0,cat:null}); S._keep=true; return render(); }
  if(b.dataset.rmParte){ lerDet(); S.det.partes.splice(+b.dataset.rmParte,1); S._keep=true; return render(); }
  if(b.dataset.juntar!==undefined){ lerDet(); S.det.cat=S.det.partes[0].cat; S.det.partes=null; S._keep=true; return render(); }
  if(b.dataset.detSalvar!==undefined){ lerDet(); const d=S.det, l=L.find(x=>x.id===d.id); const sg=l.tipo==="e"?1:-1;
    l.nome=d.nome.trim()||l.orig; l.link=d.link;
    if(d.partes){ l.partes=d.partes.map(p=>({v:sg*(parseFloat(String(p.v).replace(",","."))||0),cat:p.cat})).filter(p=>p.v); l.cat=l.partes.every(p=>p.cat)?"dividido":null; l.sub=undefined; }
    else { l.partes=undefined; if(l.cat!==d.cat){ l.cat=d.cat; l.sub=undefined; } }
    S.det=null; S._keep=true; avisar(`Salvo${l.link?`, ligado a ${nomeLink(l.link)}`:""}.`); return render(); }
  if(b.dataset.rapido){ const r=S.rapido, l=L.find(x=>x.id===r.fila[r.i]); const q=frame.querySelector("#rp-quem"); if(q) l.quem=q.value.trim(); l.cat=b.dataset.rapido; r.feitos++; r.i++; S._keep=true; return render(); }
  if(b.dataset.pular!==undefined){ S.rapido.i++; S.rapido.pulados++; S._keep=true; return render(); }
  if(b.dataset.act==="acao"){ S.acao=true; S._keep=true; return render(); }
  if(b.dataset.act==="rec"){ S.rec=!S.rec; S._keep=true; return render(); }
  if(b.dataset.act==="sync"){ if(S.sync) return; S.sync=true; S._keep=true; render(); setTimeout(()=>{S.sync=false; S._keep=true; avisar("Bancos atualizados. Nenhum lançamento novo."); render();},1400); return; }
  if(b.dataset.novo){ S.acao=false; S.novo={tipo:b.dataset.novo,conta:"Dinheiro"}; S._keep=true; render(); frame.querySelector("#nv-valor")?.focus(); return; }
  if(b.dataset.conta){ S.novo.valor=frame.querySelector("#nv-valor").value; S.novo.nome=frame.querySelector("#nv-nome").value; S.novo.conta=b.dataset.conta; S._keep=true; return render(); }
  if(b.dataset.novoSalvar!==undefined){
    const val=parseFloat((frame.querySelector("#nv-valor").value||"").replace(/\./g,"").replace(",",".")); const nome=frame.querySelector("#nv-nome").value.trim();
    if(!(val>0)){ frame.querySelector("#nv-valor").focus(); return; }
    const e=S.novo.tipo==="e"; const id="m"+Date.now(); const dt=(frame.querySelector("#nv-data").value||"19/11").slice(0,5);
    L.push({id,d:dt,tipo:e?"e":"s",nome:nome||(e?"Entrada manual":"Gasto manual"),orig:"Lançado por você",conta:S.novo.conta,v:e?val:-val,cat:null,quem:""});
    S.novo=null; S.sheet={id,cat:null,sub:null,quem:""}; S._keep=true; return render();
  }
  if(b.dataset.act==="olho"){ S.ocultar=!S.ocultar; S._keep=true; return render(); }
  if(b.dataset.mov && S.tela==="movimentos"){ S.mov=b.dataset.mov; S.filtro=null; S._keep=true; return render(); }
  if(b.dataset.filtro!==undefined && S.tela==="movimentos"){ S.filtro = S.filtro===b.dataset.filtro?null:b.dataset.filtro; S._keep=true; return render(); }
  if(b.dataset.limpar!==undefined){ const w=b.dataset.limpar; if(w==="conta") S.conta=null; else if(w==="valor") S.valorMin=0; else S.filtro=null; S._keep=true; return render(); }
  if(b.dataset.abrirDiv){ S.divAberta = S.divAberta===b.dataset.abrirDiv?null:b.dataset.abrirDiv; S._keep=true; return render(); }
  if(b.dataset.confirmar){ const c=CONFIRMAR.find(x=>x.id===b.dataset.confirmar); c.feito=true; const d=DIVIDAS.find(x=>x.id===c.div);
    if(b.dataset.resp==="sim"){ if(parcelado(d)) d.pago++; else { d.valor-=c.v; d.hist=(d.hist||[]).concat([[c.data,c.v]]); } avisar(`Baixado em ${d.nome}.`); } else avisar("Ok, não liguei esse pagamento a nenhuma dívida.");
    S._keep=true; return render(); }
  if(b.dataset.novoTipo!==undefined){ S.novoTipo=true; S._keep=true; render(); frame.querySelector("#tp-nome")?.focus(); return; }
  if(b.dataset.tipoSalvar!==undefined){ const n=frame.querySelector("#tp-nome").value.trim(); if(!n){frame.querySelector("#tp-nome").focus(); return;} const k="t"+Date.now(); TIPOS_DIV.push({k,n}); S.novoTipo=false; S.divTipo=k; S._keep=true; avisar(`Tipo "${n}" criado. Escolha ele ao adicionar ou editar uma dívida.`); return render(); }
  if(b.dataset.addDiv!==undefined){ avisar("No sistema real, abre o formulário com o campo Tipo."); S._keep=true; return render(); }
  if(b.dataset.div){ S.divTipo=b.dataset.div; S._keep=true; return render(); }
  if(b.dataset.per){ S.periodo=+b.dataset.per; S._keep=true; return render(); }
  if(b.dataset.cat){ const l=L.find(x=>x.id===b.dataset.cat); S.sheet={id:l.id,cat:l.cat,sub:l.sub||null,quem:l.quem}; S._keep=true; return render(); }
  if(b.dataset.criar){ const q=frame.querySelector("#quem"); if(q&&S.sheet) S.sheet.quem=q.value; S.criar={tipo:b.dataset.criar,nome:"",cor:CORES[(b.dataset.criar==="e"?ENTRADA:SAIDA).length%CORES.length],subs:"",voltar:b.dataset.voltar||null}; S._keep=true; render(); frame.querySelector("#cr-nome")?.focus(); return; }
  if(b.dataset.cor){ S.criar.nome=frame.querySelector("#cr-nome").value; S.criar.subs=frame.querySelector("#cr-subs").value; S.criar.cor=b.dataset.cor; S._keep=true; return render(); }
  if(b.dataset.criarSalvar!==undefined){
    const nome=frame.querySelector("#cr-nome").value.trim(); if(!nome){ frame.querySelector("#cr-nome").focus(); return; }
    const lista=S.criar.tipo==="e"?ENTRADA:SAIDA; const k="p_"+Date.now();
    const novo={k,n:nome,d:"",c:S.criar.cor,subs:frame.querySelector("#cr-subs").value.split(",").map(x=>x.trim()).filter(Boolean)};
    lista.splice(lista.length-1,0,novo);
    const v=S.criar.voltar; S.criar=null; S._keep=true;
    if(v && S.sheet){ S.sheet.cat=k; S.sheet.sub=null; } else S.sheet=null;
    avisar(`Grupo "${nome}" criado.`); return render();
  }
  if(b.dataset.sugestao){ const sg=SUGESTOES.find(x=>x.k===b.dataset.sugestao); SAIDA.splice(SAIDA.length-1,0,{k:sg.k,n:sg.n,d:sg.d,c:sg.c,subs:sg.subs}); let n=0; sg.pega.forEach(id=>{const l=L.find(x=>x.id===id); if(l&&l.cat==="outros"){l.cat=sg.k;n++;}}); S._keep=true; avisar(`"${sg.n}" criado${n?` e ${n} lançamento${n>1?"s":""} saiu de Outros`:""}.`); return render(); }
  if(b.dataset.apagar){ const e=b.dataset.tipo==="e"; const lista=e?ENTRADA:SAIDA; const i=lista.findIndex(c=>c.k===b.dataset.apagar); const c=lista[i]; lista.splice(i,1); let n=0; L.forEach(l=>{if(l.cat===c.k){l.cat=e?"outras_e":"outros"; l.sub=undefined; n++;}}); S._keep=true; avisar(`"${c.n}" apagado${n?`. ${n} lançamento${n>1?"s foram":" foi"} para ${e?"Outras entradas":"Outros gastos"}`:""}.`); return render(); }
  if(b.dataset.escolher){ const q=frame.querySelector("#quem"); if(q) S.sheet.quem=q.value; S.sheet.cat=b.dataset.escolher; S.sheet.sub=null; S._keep=true; const sc=frame.querySelector(".sheet")?.scrollTop||0; render(); const sh=frame.querySelector(".sheet"); if(sh) sh.scrollTop=sc; return; }
  if(b.dataset.sub){ S.sheet.sub = S.sheet.sub===b.dataset.sub?null:b.dataset.sub; S._keep=true; const sc=frame.querySelector(".sheet")?.scrollTop||0; render(); const sh=frame.querySelector(".sheet"); if(sh) sh.scrollTop=sc; return; }
  if(b.dataset.salvar!==undefined && S.sheet.cat){
    const l=L.find(x=>x.id===S.sheet.id); const q=frame.querySelector("#quem"); const lembrar=frame.querySelector("#lembrar")?.checked;
    l.cat=S.sheet.cat; l.sub=S.sheet.sub||undefined; if(q) l.quem=q.value.trim();
    const c=catDe(l.cat,l.tipo); S.sheet=null; S._keep=true;
    avisar(`Salvo como ${c.n}${lembrar?". Os próximos iguais seguem essa escolha.":"."}`);
    return render();
  }
});
frame.addEventListener("change", ev=>{
  if(ev.target.id==="so-pend"){ S.soPend=ev.target.checked; S._keep=true; render(); }
});
frame.addEventListener("input", ev=>{
  if(ev.target.id==="busca"){ S.busca=ev.target.value; const pos=ev.target.selectionStart; S._keep=true; render(); const i=frame.querySelector("#busca"); if(i){ i.focus(); try{i.setSelectionRange(pos,pos);}catch(e){} } return; }
  if(ev.target.id && /^pt-v-/.test(ev.target.id)){ const pos=ev.target.selectionStart, id=ev.target.id; lerDet(); S._keep=true; render(); const i=frame.querySelector("#"+id); if(i){ i.focus(); try{i.setSelectionRange(pos,pos);}catch(e){} } return; }
  if(ev.target.id==="adiantar"){ S.adiantar=+ev.target.value; S._keep=true; render(); frame.querySelector("#adiantar")?.focus(); return; }
  if(ev.target.id==="guardar"){ S.guardar=+ev.target.value; S._keep=true; render(); const r=frame.querySelector("#guardar"); if(r) r.focus(); }
});
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape" && (S.sheet||S.criar||S.acao||S.novo||S.novoTipo||S.det||S.rapido)){ S.det=null; S.rapido=null; S.novoTipo=false; S.criar=null; S.sheet=null; S.acao=false; S.novo=null; S._keep=true; render(); } });
document.getElementById("ver-pc").onclick=()=>{S.ver="pc"; if(S.tela==="mais") S.tela="inicio"; render();};
document.getElementById("ver-cel").onclick=()=>{S.ver="cel"; render();};
function doHash(){ const h=location.hash.replace("#",""); if(TELAS.includes(h)){ S.tela=h; } render(); }
window.addEventListener("hashchange", doHash);
if(window.matchMedia("(max-width:520px)").matches) S.ver="cel";
doHash();
})();
</script>
